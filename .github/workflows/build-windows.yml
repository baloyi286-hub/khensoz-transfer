name: Build Windows Receiver
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project files
        shell: pwsh
        run: |
          if (!(Test-Path desktop/receiver.py)) { throw "Missing desktop/receiver.py. Upload the MVP project files to this repository." }
          if (!(Test-Path sender-pwa/index.html)) { throw "Missing sender-pwa/index.html. Upload the MVP project files to this repository." }
      - name: Run transfer resume/integrity tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller "qrcode[pil]"
      - name: Build portable Windows executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name KhensozTransfer --add-data "sender-pwa;sender-pwa" desktop/receiver.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: KhensozTransfer-Windows
          path: dist/KhensozTransfer.exe
          if-no-files-found: error
          retention-days: 30
