<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c2a">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css?v=9">
<title>Khensoz Transfer</title>
</head>
<body>
<main>
<h1>Khensoz Transfer</h1>
<p>iPhone to Windows - Direct Wi-Fi transfer</p>
<label for="token">Pairing token</label>
<input id="token" placeholder="Token from desktop app" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="connect" type="button">Connect</button>
<p id="connection" role="status"></p>
<section>
<div class="picker-group">
<label for="photos">Photos and videos</label>
<input id="photos" type="file" accept="image/*,video/*" multiple>
<label for="files">Other files</label>
<input id="files" type="file" multiple>
</div>
<div id="pickerLoading" class="picker-loading" role="status" aria-live="polite" hidden><span class="spinner" aria-hidden="true"></span><span id="pickerLoadingText">Preparing selected files...</span></div>
<p id="pickerStatus" role="status">Picker ready. Select files above.</p>
<p id="pickerDebug" role="status" style="font-size:12px;color:#a8c5d8">Picker diagnostic: waiting for selection</p>
<p id="count" role="status">No files selected</p>
<button id="start" type="button">Transfer all</button>
</section>
<div id="queue"></div>
<p id="error" role="alert"></p>
<p class="note">Keep Safari open and your iPhone awake during transfer. Interrupted files can resume after reselecting them.</p>
</main>
<script>
/* Independent native-picker bridge. Runs even if the transfer module fails. */
(function(){
  var pickerActive=false;
  function loading(show,message){
    var el=document.getElementById("pickerLoading");
    if(el)el.hidden=!show;
    if(message){var t=document.getElementById("pickerLoadingText");if(t)t.textContent=message;}
  }
  function onPick(event){
    pickerActive=false;
    loading(true,"Preparing selected files...");
    var input=event.currentTarget;
    var files=Array.prototype.slice.call(input.files||[]);
    var status=document.getElementById("pickerStatus");
    var debug=document.getElementById("pickerDebug");
    if(debug)debug.textContent="Picker diagnostic: "+input.id+" returned "+files.length+" file(s)";
    if(status)status.textContent=files.length?files.length+" selected from "+input.id:"No files selected";
    if(files.length){
      try{window.dispatchEvent(new CustomEvent("khensoz-files-picked",{detail:{files:files,source:input.id}}));}
      finally{loading(false);}
    }else{loading(false);}

  }
  ["photos","files"].forEach(function(id){
    var input=document.getElementById(id);
    if(input){
      input.addEventListener("click",function(){
        pickerActive=true;
        loading(true,"Waiting for iPhone to prepare the selected video or files...");
      });
      input.addEventListener("change",onPick);
      input.addEventListener("cancel",function(){pickerActive=false;loading(false);});
    }
  });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&pickerActive){
      var debug=document.getElementById("pickerDebug");
      if(debug)debug.textContent="Waiting for Safari to return the selected files...";
    }
  });
  window.addEventListener("khensoz-files-queued",function(){pickerActive=false;loading(false);});
  window.addEventListener("error",function(e){
    var debug=document.getElementById("pickerDebug");
    if(debug)debug.textContent="App error: "+e.message;
  });
})();
</script>
<script type="module" src="/src.js?v=9"></script>
</body>
</html>
