<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c2a">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css?v=6">
<title>Khensoz Transfer</title>
</head>
<body>
<main>
<h1>Khensoz Transfer</h1>
<p>iPhone to Windows - Direct Wi-Fi transfer</p>
<label for="token">Pairing token</label>
<input id="token" placeholder="Token from desktop app" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="connect" type="button">Connect</button>
<p id="connection" role="status"></p>
<section>
<label class="picker">Choose photos and videos<input id="photos" type="file" accept="image/*,video/*" multiple></label>
<label class="picker secondary">Choose files<input id="files" type="file" multiple></label>
<p id="pickerStatus" role="status">Select items using either button above.</p>
<p id="count" role="status">No files selected</p>
<button id="start" type="button">Transfer all</button>
</section>
<div id="queue"></div>
<p id="error" role="alert"></p>
<p class="note">Keep Safari open and your iPhone awake during transfer. Interrupted files can resume after reselecting them.</p>
</main>
<script type="module" src="/src.js?v=6"></script>
</body>
</html>
